<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ShopSmart</title>
  <link rel="icon" type="image/svg+xml" href="assets/fallback/product-fallback.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body style="background-color: var(--bg-subtle);">

  <header style="padding: 20px 0; border-bottom: 1px solid var(--border-color); background-color: var(--bg-surface);">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="site-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        <span>ShopSmart<span class="logo-dot">.</span></span>
      </a>
      <a href="login.html" class="btn btn-secondary btn-sm"><i data-lucide="arrow-left"></i> Sign In</a>
    </div>
  </header>

  <main class="container" style="padding: 48px 0; max-width: 480px;">
    <div style="background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 36px; box-shadow: var(--shadow-md);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.625rem; font-weight: 700; margin-bottom: 6px;">Reset Password</h1>
        <p class="text-muted" style="font-size: 0.875rem;">Enter your registered email address and we will generate a password recovery link.</p>
      </div>

      <form onsubmit="handleResetSubmit(event)">
        <div style="margin-bottom: 20px;">
          <label for="resetEmail" style="font-size: 0.8125rem; font-weight: 600; display: block; margin-bottom: 6px;">Email Address *</label>
          <input type="email" id="resetEmail" placeholder="sanjith@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetSubmitBtn">
          Send Recovery Link
        </button>
      </form>

      <div id="resetFeedback" style="margin-top: 20px; font-size: 0.875rem; text-align: center;" class="hidden"></div>
      
      <div style="margin-top: 24px; text-align: center; font-size: 0.875rem;">
        Remembered your password? <a href="login.html" class="text-primary font-semibold">Sign In</a>
      </div>

    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleResetSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('resetSubmitBtn');
      const email = document.getElementById('resetEmail').value.trim();
      const feedback = document.getElementById('resetFeedback');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await window.ShopSmartAuth.sendPasswordReset(email);
        feedback.className = 'text-success font-semibold';
        feedback.textContent = res.message;
        feedback.classList.remove('hidden');
        window.ShopSmartUtils.showToast(res.message, 'success');
      } catch (err) {
        feedback.className = 'text-danger font-semibold';
        feedback.textContent = err.message;
        feedback.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Recovery Link';
      }
    }
  </script>
</body>
</html>
